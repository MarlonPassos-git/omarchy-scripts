# Personal Alacritty configuration provided by omarchy-scripts.
[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "omarchy-open-terminal-hint"
hyperlinks = true
post_processing = true
persist = false
binding = { key = "O", mods = "Control|Shift" }
mouse = { enabled = true, mods = "None" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://|obsidian://)[^\\x00-\\x1f\\x7f-\\x9f<>\"\\s{-}\\^⟨⟩`\\\\]+|(?m:(?:^|[\\s\"'`(<\\[=:])(?:~/|/)(?:[^/\\s\\x00-\\x1f\\x7f-\\x9f<>\"'`()\\[\\]{}:*?\\\\|]+/)*(?i:[^/\\s\\x00-\\x1f\\x7f-\\x9f<>\"'`()\\[\\]{}:*?\\\\|]+\\.(?:md|markdown|mdx|pdf|doc|docx|ppt|pptx|epub|mp3|m4a|flac|wav|opus|ogg|zip|7z|rar|tar|gz|bz2|xz|txt|rst|adoc|org|tex|log|csv|tsv|js|jsx|mjs|cjs|ts|tsx|mts|cts|py|pyi|pyw|rb|php|go|rs|c|h|cc|hh|cpp|hpp|cxx|hxx|cs|fs|fsx|java|kt|kts|scala|swift|m|mm|dart|lua|pl|pm|r|jl|ex|exs|erl|hrl|clj|cljs|cljc|edn|hs|lhs|ml|mli|elm|nim|zig|v|sol|sh|bash|zsh|fish|ps1|psm1|bat|cmd|html|htm|css|scss|sass|less|vue|svelte|astro|svg|png|jpe?g|gif|webp|bmp|tiff?|avi|m4v|mkv|mov|mp4|mpeg|mpg|ogv|webm|wmv|xml|xsl|xslt|json|jsonc|json5|jsonl|ndjson|yaml|yml|toml|ini|conf|cfg|properties|env|lock|sql|graphql|gql|proto|tf|tfvars|hcl|nix|cmake|gradle|eta|ejs|hbs|handlebars|mustache|j2|jinja|jinja2|twig|liquid|tmpl|tpl|template|patch|diff|desktop|service|socket|timer)|Dockerfile|Containerfile|Makefile|GNUmakefile|Justfile|Gemfile|Rakefile|Procfile|Vagrantfile|Brewfile|Jenkinsfile|README|LICENSE|LICENCE|COPYING|CHANGELOG|AUTHORS|NOTICE|VERSION|\\.gitignore|\\.gitattributes|\\.gitmodules|\\.gitconfig|\\.dockerignore|\\.editorconfig|\\.npmrc|\\.yarnrc|\\.nvmrc|\\.prettierignore|\\.prettierrc|\\.eslintignore|\\.eslintrc|\\.bashrc|\\.bash_profile|\\.bash_logout|\\.zshrc|\\.zprofile|\\.profile|\\.env(?:\\.[\\w-]+)*|\\.tool-versions)(?:\\.bak(?:[.-][0-9][0-9-]*)?)?(?:$|[\\s\"'`()\\[\\]{}<>:,;!?]|\\.(?:$|[\\s\"'`()\\[\\]{}<>:,;!?])))|(?m:(?:^|[\\s\"'`(<\\[=:])(?:~/|/)(?:[^/\\s\\x00-\\x1f\\x7f-\\x9f<>\"'`()\\[\\]{}:*?\\\\|]+/)+(?:$|[\\s\"'`()\\[\\]{}<>:,;!?]|\\.(?:$|[\\s\"'`()\\[\\]{}<>:,;!?])))"

# Beta: one-line Codex commands; blank margins reduce truncated-row matches.
[[hints.enabled]]
command = "omarchy-copy-code-hint"
hyperlinks = false
post_processing = false
persist = false
binding = { key = "Y", mods = "Control|Shift" }
mouse = { enabled = false }
regex = '''(?m)(?:[ \t]{2,}(?:[•$][ \t]+)?|(?:^|[│┃║])[•$][ \t]+)(?:[A-Za-z_][A-Za-z0-9_]*=(?:"[^"\r\n│┃║]*"|'[^'\r\n│┃║]*'|[^ \t\r\n│┃║]+)[ \t]+)*(?:(?:pnpm|vtex|forge|node|jam|curl|perl|python3|codex\-security|cd|npx|npm|omarchy|yarn|bash|bkt|tail|tailscale|cw\-inspect|pacman|sudo|env|timeout|command|nohup)|(?:\.{1,2}/[^ \t\r\n│┃║"']+|(?:~/|/)[^ \t\r\n│┃║"']*(?:\.(?:sh|py|ts)|/bin/[^ \t\r\n│┃║"']+)))(?:[ \t]+(?:[^ \t\r\n"'\\│┃║<&|]+|'[^'\r\n│┃║]*'|"(?:[^"\\\r\n│┃║]|\\[^\r\n│┃║])*"|\\[^ \t\r\n│┃║])+)*[ \t]{2,}(?:$|[│┃║])'''
